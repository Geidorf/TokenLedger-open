[package]
name = "tokenledger"
version = "2.0.0"
description = "TokenLedger native desktop app (Tauri 2 + React)"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.92"
# 除桌面端外还有 src/bin/tokenledger-cli.rs；`cargo run` 与 Tauri 打包默认指桌面端。
default-run = "tokenledger"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.2"

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dirs = "6.0.0"
tokio = { version = "1.48", features = ["rt", "time", "net", "sync"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
walkdir = "2.5"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
hostname = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
# 只读写 PNG（锁屏背景解码、壁纸与预览编码）。关掉默认格式，避免带入 AVIF 编码链及其停止维护的宏依赖。
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
tauri = { version = "2.0.0", features = ["custom-protocol", "tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-notification = "2.4.0"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
portable-pty = "0.9"
sha2 = "0.10"
# 外部网关同步格式（PBKDF2-SHA256 + AES-256-GCM）；ring 已是 rustls 的依赖，不新增 crate。
ring = "0.17"
base64 = "0.22"
# 外部网关共享用量文件是 gzip；flate2 已在 Cargo.lock 中（间接依赖），不新增 crate。
flate2 = "1"
# 0.14.3 起修复 RUSTSEC-2026-0391/0398/0403/0410 及同批 unsound 公告，见 docs/rust-dependency-advisories.md。
zstd = "0.14.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
getrandom = "0.3"
toml_edit = "=0.20.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62.2", features = ["Foundation", "Storage", "Storage_Streams", "System_UserProfile", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10"
cocoa = "0.26"
objc = "0.2.7"
window-vibrancy = "0.6"
