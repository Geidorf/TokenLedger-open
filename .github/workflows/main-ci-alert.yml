name: Main CI Alert

# main 上的推送 CI 失败时，在固定的「main 红灯」Issue 下点名失败的 job 与触发提交，
# 让作者工位第一时间修；恢复绿后再记一笔。不自动回滚。
# 各 PR 在旧 main 上各自绿、合并后才红的情况只能在 main 上发现（个人仓库没有合并队列）。
on:
  workflow_run:
    workflows: [ TokenLedger CI ]
    types: [ completed ]
    branches: [ main ]

permissions:
  actions: read
  contents: read
  issues: write

# 串行写同一个 Issue（建 Issue、判断上一条记录不并发）。默认只留 1 个 pending，
# 后来的会顶掉前一个导致漏记，所以显式 queue: max（最多排 100 个，远超 main 的提交节奏）。
concurrency:
  group: main-ci-alert
  cancel-in-progress: false
  queue: max

jobs:
  alert:
    name: Report main CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 只看推送触发、跑完的 run；被取消的不算红。
    if: >-
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Comment on the main CI issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          TITLE='[CI] main 红灯记录'
          MARKER="<!-- main-ci-alert run=$RUN_ID attempt=$RUN_ATTEMPT -->"
          issue=$(gh issue list -R "$REPO" --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          # 「上一条记录」只看本工作流（github-actions[bot]）写的评论，翻完所有页取最后一条的首行。
          last=''
          if [ -n "$issue" ]; then
            gh api --paginate "repos/$REPO/issues/$issue/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body' > bot-comments.txt
            # 同一次运行（run id + 第几次尝试）重复投递时已记过就不再写；重跑是新的尝试，照常记。
            if grep -qxF "$MARKER" bot-comments.txt; then
              exit 0
            fi
            last=$(gh api --paginate "repos/$REPO/issues/$issue/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body | split("\n")[0]' | tail -n 1)
          fi
          short=${SHA:0:7}
          # 提交消息来自仓库内容，只经文件传给 gh，不拼进 shell 命令。
          gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' > message.txt
          subject=$(head -n 1 message.txt)
          agent=$(grep -m 1 '^Agent: ' message.txt | cut -d' ' -f2- || true)

          if [ "$CONCLUSION" = "success" ]; then
            # 只有上一条是红灯时才记恢复，平时绿不刷屏。
            case "$last" in
              '[CI] main 红：'*) ;;
              *) exit 0 ;;
            esac
            # main 上的 run 互不取消、完成顺序可能乱：只有当前 main 最新提交绿了才算恢复。
            head=$(gh api "repos/$REPO/commits/main" --jq '.sha')
            [ "$head" = "$SHA" ] || exit 0
            {
              echo "[CI] main 已恢复绿：\`$short\`"
              echo
              echo "- 提交：$subject"
              echo "- 运行：$RUN_URL"
              echo
              echo "$MARKER"
            } > body.md
            gh issue comment "$issue" -R "$REPO" --body-file body.md
            exit 0
          fi

          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name)：\(.html_url)"' > jobs.txt
          {
            echo "[CI] main 红：\`$short\`"
            echo
            echo "- 提交：$subject"
            echo "- 工位：${agent:-未写 Agent 行（视为维护者本人）}"
            echo "- 运行：$RUN_URL"
            echo "- 失败的 job："
            cat jobs.txt
            echo
            echo "处理：提交所属工位优先修；常见原因是两个 PR 各自在旧 main 上绿、合并后冲突。修复 PR 标题写明「修复 main」。不要回滚别人的提交。"
            echo
            echo "$MARKER"
          } > body.md
          if [ -z "$issue" ]; then
            {
              echo "[CI] 这个 Issue 由 main-ci-alert.yml 自动维护：main 上的推送 CI 失败时在这里点名，恢复绿后再记一笔。"
              echo
              echo "保持打开；不要手动关闭。"
            } > issue.md
            issue=$(gh issue create -R "$REPO" --title "$TITLE" --body-file issue.md | grep -o '[0-9]*$')
          fi
          gh issue comment "$issue" -R "$REPO" --body-file body.md
