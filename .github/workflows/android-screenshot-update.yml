name: Android Screenshot Golden Update

# 视觉改动的金图只能在 macOS 金图主机上生成（ADR-007）。手动触发后，在指定分支上
# 重新生成截图基线并提交回该分支，供前后对比与评审；不允许对 main 运行。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要更新截图基线的功能分支（不能是 main）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-screenshot-update-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  update-goldens:
    name: Regenerate Android screenshot goldens (macOS golden host)
    runs-on: macos-14
    timeout-minutes: 60
    if: ${{ inputs.branch != 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate screenshot goldens
        run: node scripts/run-android-gradle.mjs :app:updateDebugScreenshotTest

      - name: Commit regenerated goldens to the branch
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/android/app/src/screenshotTestDebug/reference
          if git diff --cached --quiet; then
            echo '截图基线没有变化。'
            exit 0
          fi
          git commit -m 'Android：在 macOS 金图主机上重新生成截图基线' -m 'Agent: github-actions'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
