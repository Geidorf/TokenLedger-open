name: Android Performance Probe

# 在 Linux runner 的 Android 模拟器上量冷启动首帧、明细滚动掉帧与路由动画帧率（scripts/android-perf-probe.mjs）。
# 手动触发；改动探针本身的 PR 也会跑一次，确认它还能用。不是合并门禁：模拟器为软件渲染，
# 数字只用于同一 runner 上前后对比。
# 结果写进本次运行的摘要，并上传 android-perf-probe 产物（JSON + Markdown）。
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: '模拟器 Android API 级别'
        required: false
        default: '34'
        type: string
      runs:
        description: '每项冷启动测几次（取中位数）'
        required: false
        default: '10'
        type: string
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/android-perf-probe.yml'
      - 'scripts/android-perf-probe.mjs'
      - 'scripts/android-perf-probe.test.mjs'
      - 'apps/android/app/src/qa/**'

permissions:
  contents: read

concurrency:
  group: android-perf-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Measure on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 与 CI 的 android-test 同一组公开夹具值：只让 App 走到登录屏，不连任何真实云端。
      TOKENLEDGER_SUPABASE_URL: https://ci-fixture.supabase.co
      TOKENLEDGER_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      SYSTEM_IMAGE: system-images;android-${{ inputs.api-level || '34' }};google_apis;x86_64
      PROBE_RUNS: ${{ inputs.runs || '10' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the probe's parsers
        run: node --test scripts/android-perf-probe.test.mjs

      - name: Build the QA package (includes the probe activity)
        run: node scripts/run-android-gradle.mjs -Ptokenledger.qa=true :app:assembleQa

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator and system image
        run: |
          # avdmanager 与 emulator 在 runner 上默认找的 AVD 目录不一致，显式指定同一个。
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install emulator platform-tools "$SYSTEM_IMAGE" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n perf -k "$SYSTEM_IMAGE" -d pixel_6
          ls "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Boot the emulator
        timeout-minutes: 15
        run: |
          emulator -accel-check || true
          nohup emulator -avd perf -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none > emulator.log 2>&1 &
          EMULATOR_PID=$!
          # 模拟器进程退出时 adb wait-for-device 会一直等，所以自己轮询并盯着进程。
          booted=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "emulator exited early"
              break
            fi
            if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "booted after ${attempt} checks"
              booted=1
              break
            fi
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            tail -80 emulator.log
            exit 1
          fi
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1

      - name: Install the QA package
        run: adb install -r -g apps/android/app/build/outputs/apk/qa/app-qa.apk

      - name: Measure
        run: node scripts/android-perf-probe.mjs --package com.jeidorf.tokenledger.mobile.qa --runs "$PROBE_RUNS" --out build/android-perf

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-perf-probe
          path: |
            build/android-perf
            emulator.log
          if-no-files-found: warn

      - name: Stop the emulator
        if: always()
        run: adb emu kill || true
