name: TokenLedger CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同一分支的新推送取消仍在排队/运行的旧 run，避免连续推送把 8 个 job 排成长队。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Collaboration Docs & Commit Message Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 需要完整历史才能对 origin/main..HEAD 求范围；浅克隆会让范围为空而假通过。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 校验状态枚举、DoD、依赖、里程碑、Active Claims 与任务日志双向一致。
      # 纯 Node 只读脚本，不依赖 npm 依赖树，因此不需要 npm ci。
      - name: Verify collaboration ledger and task logs
        run: node scripts/check-docs.mjs

      # JEID-38：run 挂死 1h43m 以前只能靠人工发现。这个探针把「这条 run 是否还在产出」
      # 变成可执行判定；纯 Node、无 npm 依赖。CI 上没有 multica CLI 时它退化为
      # unknown/退出码 2 —— 不静默通过，但也只有夹具用例会真的判定 stalled。
      - name: Verify run health probe contract
        run: npm run test:run-health

      # 中文提交主题此前只由本地 .githooks 校验：需要每个 worktree 手动执行
      # git config core.hooksPath .githooks，忘了就完全失效，--no-verify 也能绕过。
      # 见 docs/audits/collaboration-process-20260725.md §六缺口 1。
      - name: Verify commit subjects contain Chinese
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR 事件检出的是 GitHub 合成的 "Merge <head> into <base>" 提交（英文主题），
            # 必须只校验 PR 自己的提交：以 PR head SHA 为终点。
            RANGE="origin/$BASE_REF..${PR_HEAD_SHA:-HEAD^2}"
          elif [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            RANGE="$BEFORE_SHA..HEAD"
          else
            # 首次推送或强制推送后 before 不可解析，退化为只查最新提交。
            RANGE="HEAD~1..HEAD"
          fi
          echo "校验范围：$RANGE"
          node scripts/check-commit-message.mjs --range "$RANGE"

  frontend-check:
    name: Frontend Contracts & Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ESLint（react-hooks/exhaustive-deps=error）、vitest 与路径长度检查此前只在
      # 本地 `npm run check` 里跑：T10.60 那类回归的机器防线在 PR 主路径上并不存在。
      - name: Verify versions, paths, lint, types, contracts, unit tests and production bundle
        run: |
          npm run version:check
          npm run check:paths
          npm run typecheck
          npm run lint
          npm run test:frontend
          npm run test:unit
          npm run test:release-manifest
          npm run test:release-security
          npm run build:web
          node scripts/check-bundle-budget.mjs

      # 今日/本周/本月按本地零点切分是本项目的高频事故区（跨时区丢数、月末截断）。
      # 在两个远离 UTC、且带非整点偏移的时区下重跑单测与契约，避免只在 UTC runner
      # 上"碰巧正确"。本机（Asia/Shanghai）已实测两组均通过。
      - name: Re-run unit and contract tests under non-UTC time zones
        run: |
          TZ=Pacific/Kiritimati npm run test:unit
          TZ=Asia/Kathmandu npm run test:frontend

  rust-test:
    name: Rust Format, Clippy & Tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 钉住工具链版本会切到 minimal profile，rustfmt/clippy 不再随 default
      # profile 一起装。T10.71 从 @stable 改成 @1.96.0 后本 job 一直挂在
      # `cargo-fmt is not installed`，必须显式声明组件。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # tauri::generate_context! 在编译期校验 tauri.conf.json 的 frontendDist
      # （../dist）存在；rust job 不构建前端，缺占位目录会让 proc macro 直接
      # panic（首轮真实 CI 即因此失败）。空目录即可满足配置校验。
      - name: Create placeholder frontendDist
        run: mkdir -p dist

      - name: Reject every Rust warning
        env:
          RUSTFLAGS: '--check-cfg=cfg(feature,values("cargo-clippy"))'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      # chrono 的 Local 在 unix 上尊重 TZ；用一个 +05:45 的非整点时区重跑，
      # 覆盖扫描器落库、统计分桶与对比周期里所有 Local::now() 相关的边界。
      - name: Re-run Cargo tests under a non-UTC time zone
        env:
          TZ: Asia/Kathmandu
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

  # Windows 是一等发布目标（锁屏壁纸等能力为其独占），且 #[cfg(windows)] 代码在
  # macOS runner 上既不会被编译也不会被 clippy 分析：b60f2bd 曾因 Windows 专属
  # 块缺少 std::fs::File 导入让主干在 Windows 上编译不过 109 个提交，直到人工
  # 构建（T10.59）才暴露。此 job 用 clippy -D warnings + 全量测试封住该缺口。
  rust-test-windows:
    name: Rust Windows Clippy & Tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # 两条 Compose golden 的仓库内相对路径为 232/234 字符，加上 runner 的
      # `D:\a\TokenLedger\TokenLedger\` 前缀就越过了 Windows MAX_PATH，checkout
      # 会以 `Filename too long` 失败，本 job 因此从未真正跑到过 clippy。必须用
      # --system：actions/checkout 会临时改写 HOME，--global 写不进它读到的配置。
      # T10.77 负责把文件名收敛掉，届时本步骤仍作为深层 clone 的兜底保留。
      - name: Allow long paths on the Windows runner
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 同 rust-test：generate_context! 需要 frontendDist 占位目录。
      - name: Create placeholder frontendDist
        shell: bash
        run: mkdir -p dist

      - name: Reject every Rust warning on Windows
        env:
          RUSTFLAGS: '--check-cfg=cfg(feature,values("cargo-clippy"))'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run Cargo tests on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

  windows-native-build:
    name: Windows Tauri Native Build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # 同 rust-test-windows：超长 golden 路径会让 checkout 直接失败。
      - name: Allow long paths on the Windows runner
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend and Tauri dependencies
        run: npm ci

      # This compiles the complete Windows Tauri application, including the
      # #[cfg(windows)] shell and the merged Windows configuration. It avoids
      # signing/installer secrets; signed MSI remains a release-only concern.
      - name: Build the Windows Tauri application
        run: npm run build -- --no-bundle --ci

      - name: Verify the native executable exists
        shell: pwsh
        run: |
          $executable = Get-Item "src-tauri/target/release/tokenledger.exe" -ErrorAction Stop
          if ($executable.Length -le 0) {
            throw "Windows Tauri executable is empty"
          }
          $expectedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # ProductVersion 可能是三段（2.0.0）也可能是四段（2.0.0.0）；只取前三段比对。
          # 旧写法去掉末尾 ".0" 会把 2.0.0 截成 2.0。
          $actualVersion = ($executable.VersionInfo.ProductVersion -split '\.')[0..2] -join '.'
          if ($actualVersion -ne $expectedVersion) {
            throw "Windows Tauri executable version $actualVersion does not match package version $expectedVersion"
          }

  android-test:
    name: Android Unit, Lint & Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOKENLEDGER_SUPABASE_URL: https://ci-fixture.supabase.co
      TOKENLEDGER_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ADR-007: Ubuntu owns logic/build gates; screenshot goldens are
      # rasterized and validated on the macOS host family that produces them.
      - name: Run Android unit, lint, debug and R8 release gates
        run: node scripts/run-android-gradle.mjs testDebugUnitTest :app:testSupabaseClientKeyPolicy lintDebug assembleDebug assembleRelease

  android-screenshot:
    name: Android Screenshot Regression (macOS golden host)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Android screenshot goldens on the source host family
        run: node scripts/run-android-gradle.mjs :app:validateDebugScreenshotTest

      # 视觉改动需要前后对比：无论通过与否都上传渲染结果与差异报告，截图不进 Git。
      - name: Upload Android screenshot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-report
          path: |
            apps/android/app/build/reports/screenshotTest
            apps/android/app/build/outputs/screenshotTest-results
          if-no-files-found: ignore
          retention-days: 14

  supabase-test:
    name: Supabase Fresh Replay, RLS, RPC & EXPLAIN
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # 门禁只认 checkout 之外的专用项目与端口（见脚本头注释），不能直接 `supabase start`。
      - name: Start isolated Supabase services
        run: scripts/start-supabase-gate-isolation.sh "$RUNNER_TEMP/supabase-gate" "tokenledger-t0-ci-sql-gh${{ github.run_id }}"

      - name: Replay migrations and run strict release SQL gates
        run: npm run supabase:verify:release

      - name: Stop isolated Supabase services
        if: always()
        run: |
          if [ -n "${TOKENLEDGER_SUPABASE_GATE_WORKDIR:-}" ]; then
            supabase stop --no-backup --workdir "$TOKENLEDGER_SUPABASE_GATE_WORKDIR"
          fi
