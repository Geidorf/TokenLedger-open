name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe? What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - Other
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Which AI tool is involved?
      description: For example Claude Code, Codex, Gemini CLI, Cursor
      placeholder: "Claude Code 2.1.237"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste relevant log output. Remove tokens, cookies, session data,
        account identifiers, and local file paths first.
      render: shell
