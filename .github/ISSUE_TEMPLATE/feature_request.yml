name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: |
        Which platforms are affected — desktop, Android, cloud, or all?
        Is this visible in the UI, or does it affect only data and contracts?
